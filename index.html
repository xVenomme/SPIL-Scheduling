<html lang="it">

<style>
/* Layout: una colonna da quaderno a quadretti; ogni algoritmo = idea, ricetta, dati modificabili, passi con grafici */
:root {
  --paper: #f3f5f4;
  --card: #ffffff;
  --ink: #17201c;
  --muted: #56645d;
  --line: #d3dcd7;
  --grid: rgba(23, 120, 74, 0.07);
  --accent: #17784a;
  --accent-soft: #e2f1e8;
  --mark: #ffe46b;
  --late: #c2412d;
  --late-soft: #fbe6e1;
  --ok: #2f7d4f;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --j0: #8ec5a4; --j1: #94b8e6; --j2: #f2b880; --j3: #cba6e2; --j4: #efd46c; --j5: #e89cab; --j6: #8dd2d5; --j7: #c6c68a;
  --jt: #17201c;
  --rect-op: 0.55;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111614; --card: #18201c; --ink: #e5ece8; --muted: #9aa8a1; --line: #2c3833; --grid: rgba(70, 192, 132, 0.06);
    --accent: #4cc489; --accent-soft: #1c3428; --mark: rgba(255, 214, 70, 0.38); --late: #ff7d66; --late-soft: #3a1f1a; --ok: #5fcf8f;
    --j0: #2f7b56; --j1: #355f97; --j2: #a2601f; --j3: #6d4797; --j4: #876f12; --j5: #964150; --j6: #1d787c; --j7: #696a2b;
    --jt: #f3f6f4; --rect-op: 0.7;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111614; --card: #18201c; --ink: #e5ece8; --muted: #9aa8a1; --line: #2c3833; --grid: rgba(70, 192, 132, 0.06);
  --accent: #4cc489; --accent-soft: #1c3428; --mark: rgba(255, 214, 70, 0.38); --late: #ff7d66; --late-soft: #3a1f1a; --ok: #5fcf8f;
  --j0: #2f7b56; --j1: #355f97; --j2: #a2601f; --j3: #6d4797; --j4: #876f12; --j5: #964150; --j6: #1d787c; --j7: #696a2b;
  --jt: #f3f6f4; --rect-op: 0.7;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.5;
}

h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; }

  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);

}
.topbar .in { max-width: 780px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 10px; align-items: center; }

.brand span { color: var(--accent); }
.topbar select { flex: 1; min-width: 0; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); font-size: 0.95rem; }

main { max-width: 780px; margin: 0 auto; padding: 18px 16px 80px; display: grid; gap: 18px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.eyebrow { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 0.88rem; }
p { margin: 0; }
ul, ol { margin: 0; padding-left: 1.25em; display: grid; gap: 4px; }

.algohead { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center; }
.num { grid-row: span 2; width: 52px; height: 52px; border-radius: 50%; border: 2.5px solid var(--accent); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; color: var(--accent); }
.nota { font-family: var(--font-mono); font-size: 0.85rem; background: var(--accent-soft); color: var(--accent); padding: 2px 8px; border-radius: 6px; justify-self: start; }
.hl { background: linear-gradient(transparent 55%, var(--mark) 55%); padding: 0 2px; }
.idea { border-left: 4px solid var(--accent); padding: 4px 0 4px 12px; display: grid; gap: 6px; }
.analog { font-style: italic; color: var(--muted); }
.recipe li::marker { font-family: var(--font-mono); color: var(--accent); font-weight: 600; }

/* editor dati */
.exrow { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 0.9rem; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--card); }
.chip:hover { border-color: var(--accent); }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; }

.dt { font-family: var(--font-mono); font-size: 0.85rem; }

.ed input { width: 4.2em; padding: 5px 4px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); text-align: center; font-family: var(--font-mono); font-size: 0.85rem; }
.ed input.wide { width: 9.5em; text-align: left; }

.ed .x { border: none; background: none; color: var(--muted); cursor: pointer; font-size: 1.1rem; padding: 2px 6px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 0.92rem; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--card); border-color: var(--accent); }

.field { display: grid; gap: 4px; }
.field label { font-size: 0.85rem; color: var(--muted); }
.field input[type="text"] { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); font-family: var(--font-mono); font-size: 0.88rem; }

/* passi */

.dots { display: flex; flex-wrap: wrap; gap: 5px; }

.nav { display: flex; gap: 8px; justify-content: space-between; align-items: center; }

.exam { border: 2px solid var(--accent); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; background: var(--accent-soft); }
.exam h3 { color: var(--accent); }

.seq { font-family: var(--font-mono); font-weight: 600; }

/* svg */

.g-dueline { stroke: var(--late); stroke-width: 1.4; stroke-dasharray: 3 2; }

.t-node rect { fill: var(--card); stroke: var(--ink); stroke-width: 1.2; }

.t-node .sub { font-size: 9.5px; fill: var(--muted); }

.t-node.opt rect { fill: var(--accent); stroke: var(--accent); }
.t-node.opt text { fill: var(--card); }
.t-edge { stroke: var(--muted); stroke-width: 1.2; fill: none; }
.t-elbl { font-size: 9.5px; fill: var(--muted); }
.pl-grid { stroke: var(--line); stroke-width: 1; }
.pl-axis { stroke: var(--ink); stroke-width: 1.4; }
.pl-path { stroke: var(--accent); stroke-width: 2.6; fill: none; stroke-linejoin: round; }
.pl-try { stroke: var(--muted); stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
.pl-alt { stroke: var(--muted); stroke-width: 1.4; fill: none; opacity: 0.55; }
.pl-pt { fill: var(--card); stroke: var(--ink); stroke-width: 1.4; }
.pl-pt.cur { fill: var(--mark); }
.pl-ptlbl { font-size: 10px; font-weight: 600; }
.pl-tool { font-size: 12px; font-weight: 600; }

.home-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.algo-link { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; text-decoration: none; color: var(--ink); border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 12px; }
.algo-link:hover { border-color: var(--accent); }
.algo-link .n { grid-row: span 2; font-family: var(--font-display); font-weight: 800; color: var(--accent); font-size: 1.2rem; width: 1.6em; text-align: center; }
.algo-link .t { font-weight: 700; }
.algo-link .s { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); }
.quiz { display: grid; gap: 10px; }
.quiz .q { font-weight: 700; font-size: 1.05rem; }
.quiz .opts { display: flex; flex-wrap: wrap; gap: 8px; }
.trail { display: flex; flex-wrap: wrap; gap: 6px; font-size: 0.85rem; color: var(--muted); }
.trail span::after { content: " ›"; }
.answer { border: 2px solid var(--accent); border-radius: 12px; padding: 12px; display: grid; gap: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 0.8rem; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; border: 1px solid var(--ink); }
footer { max-width: 780px; margin: 0 auto; padding: 0 16px 40px; color: var(--muted); font-size: 0.82rem; }
@media (max-width: 420px) { body { font-size: 16px; } h1 { font-size: 1.6rem; } .card { padding: 13px; } }
@media (prefers-reduced-motion: no-preference) { .step { animation: fade 0.18s ease-out; } @keyframes fade { from { opacity: 0.4; transform: translateY(3px); } to { opacity: 1; transform: none; } } }
</style>

<body>
<header class="topbar"><div class="in">
  <a class="brand" href="#home">SPIL<span>·</span>Scheduling</a>
  <select id="pick" aria-label="Scegli l'algoritmo"></select>

<main id="app"></main>
<script>
// ===================== CORE: risolutori puri =====================
// Ogni job: {id, p, d, r, w, ...}. Nessuna dipendenza dal DOM.

const byIdx = (arr) => arr.map((x, i) => i);

// completamenti in sequenza (rispetta r se presente)
function cumulate(seq) {
  let t = 0;
  return seq.map((j) => {
    const s = Math.max(t, j.r || 0);
    t = s + j.p;
    return { job: j, S: s, C: t };
  });
}

// ---------- 1. SPT ----------
function sptOrder(jobs) {
  const hasD = jobs.every((j) => Number.isFinite(j.d));
  return jobs
    .map((j, i) => ({ j, i }))
    .sort((a, b) => a.j.p - b.j.p || (hasD ? a.j.d - b.j.d : 0) || a.i - b.i)
    .map((o) => o.j);
}

// ---------- 2. WSPT ----------
function wsptOrder(jobs) {
  return jobs
    .map((j, i) => ({ j, i }))
    .sort((a, b) => a.j.p / a.j.w - b.j.p / b.j.w || a.i - b.i)
    .map((o) => o.j);
}

// ---------- 3. EDD ----------
function eddOrder(jobs) {
  return jobs
    .map((j, i) => ({ j, i }))
    .sort((a, b) => a.j.d - b.j.d || a.j.p - b.j.p || a.i - b.i)
    .map((o) => o.j);
}

// ---------- 4. MOORE ----------
function moore(jobs) {
  const order = eddOrder(jobs);
  let seq = [];
  const late = [];
  const iters = [];
  for (const j of order) {
    seq.push(j);
    const cum = cumulate(seq);
    const last = cum[cum.length - 1];
    const it = { inserted: j, seqBefore: seq.slice(), cum, C: last.C, late: last.C > j.d, removed: null };
    if (it.late) {
      // togli il più lungo tra quelli in sequenza (a parità, il più vicino alla fine)
      let k = 0;
      for (let i = 1; i < seq.length; i++) if (seq[i].p >= seq[k].p) k = i;
      it.removed = seq[k];
      late.push(seq[k]);
      seq = seq.filter((_, i) => i !== k);
      it.cumAfter = cumulate(seq);
    }
    it.seqAfter = seq.slice();
    it.lateList = late.slice();
    iters.push(it);
  }
  return { order, iters, ontime: seq, late, final: seq.concat(late) };
}

// ---------- parser espressioni per h_i(C) ----------
// numeri con punto o virgola decimale ("1,5"); argomenti separati da ", " (con spazio) o ";"
function compileH(src) {
  const s = String(src);
  let i = 0;
  const ws = () => { while (i < s.length && /\s/.test(s[i])) i++; };
  const peek = () => { ws(); return s[i]; };
  function primary() {
    const c = peek();
    if (c === '(') { i++; const e = expr(); if (peek() !== ')') throw new Error('manca una ")"'); i++; return e; }
    const mn = /^\d+(?:[.,]\d+)?/.exec(s.slice(i));
    if (mn) { i += mn[0].length; const v = parseFloat(mn[0].replace(',', '.')); return () => v; }
    const m = /^[A-Za-z_]\w*/.exec(s.slice(i));
    if (!m) throw new Error('simbolo inatteso "' + (c || 'fine formula') + '"');
    i += m[0].length;
    const name = m[0];
    if (peek() === '(') {
      i++;
      const args = [];
      if (peek() !== ')') { args.push(expr()); while (peek() === ',' || peek() === ';') { i++; args.push(expr()); } }
      if (peek() !== ')') throw new Error('manca una ")" dopo ' + name);
      i++;
      const f = { max: (a) => Math.max(...a), min: (a) => Math.min(...a), abs: (a) => Math.abs(a[0]), exp: (a) => Math.exp(a[0]), ln: (a) => Math.log(a[0]), log: (a) => Math.log(a[0]), sqrt: (a) => Math.sqrt(a[0]), pow: (a) => Math.pow(a[0], a[1]) }[name.toLowerCase()];
      if (!f) throw new Error('funzione sconosciuta: ' + name);
      return (env) => f(args.map((a) => a(env)));
    }
    return (env) => {
      if (name === 'T') return Math.max(0, env.C - env.d);
      if (name === 'L') return env.C - env.d;
      if (!(name in env) || !Number.isFinite(env[name])) throw new Error('variabile sconosciuta o vuota: ' + name);
      return env[name];
    };
  }
  function unary() { const c = peek(); if (c === '-') { i++; const u = unary(); return (e) => -u(e); } if (c === '+') { i++; return unary(); } return primary(); }
  function power() { const b = unary(); if (peek() === '^') { i++; const ex = power(); return (e) => Math.pow(b(e), ex(e)); } return b; }
  function term() { let a = power(); for (;;) { const c = peek(); if (c !== '*' && c !== '/') return a; i++; const b = power(); const a0 = a; a = c === '*' ? (e) => a0(e) * b(e) : (e) => a0(e) / b(e); } }
  function expr() { let a = term(); for (;;) { const c = peek(); if (c !== '+' && c !== '-') return a; i++; const b = term(); const a0 = a; a = c === '+' ? (e) => a0(e) + b(e) : (e) => a0(e) - b(e); } }
  const e = expr();
  if (peek() !== undefined) throw new Error('carattere inatteso "' + s[i] + '"');
  return e;
}

// ---------- 5. LAWLER ----------
// prec: array di [a,b] = a prima di b
function lawler(jobs, prec) {
  const fns = jobs.map((j) => compileH(j.h));
  const h = (k, C) => fns[k]({ C, p: jobs[k].p, d: jobs[k].d, w: jobs[k].w });
  const succ = jobs.map(() => []);
  prec.forEach(([a, b]) => succ[a].push(b));
  const placed = new Array(jobs.length).fill(false);
  let tau = jobs.reduce((s, j) => s + j.p, 0);
  const back = [];
  const iters = [];
  while (back.length < jobs.length) {
    const cand = [];
    jobs.forEach((j, k) => { if (!placed[k] && succ[k].every((s) => placed[s])) cand.push(k); });
    if (!cand.length) return { error: 'Le precedenze formano un ciclo: nessun job può andare in fondo.' };
    const vals = cand.map((k) => ({ k, v: h(k, tau) }));
    let best = vals[0];
    vals.forEach((o) => { if (o.v < best.v - 1e-9) best = o; });
    const ties = vals.filter((o) => Math.abs(o.v - best.v) < 1e-9).length > 1;
    const blocked = jobs.map((j, k) => k).filter((k) => !placed[k] && !cand.includes(k));
    iters.push({ tau, cand: vals, pick: best.k, ties, blocked });
    placed[best.k] = true;
    back.push(best.k);
    tau -= jobs[best.k].p;
  }
  const seqIdx = back.slice().reverse();
  let t = 0;
  const res = seqIdx.map((k) => { t += jobs[k].p; return { k, C: t, h: h(k, t) }; });
  const fo = Math.max(...res.map((r) => r.h));
  return { iters, seqIdx, res, fo };
}

// ---------- 6. EDD con preemption + B&B 1|rj|Lmax ----------
// rest: job ancora da fare; t0 istante di partenza
function prmpEDD(rest, t0) {
  const rem = new Map(rest.map((j) => [j, j.p]));
  const segs = [];
  let t = t0;
  const done = new Map();
  while ([...rem.values()].some((v) => v > 1e-9)) {
    const avail = rest.filter((j) => rem.get(j) > 1e-9 && Math.max(j.r || 0, t0) <= t + 1e-9);
    if (!avail.length) { t = Math.min(...rest.filter((j) => rem.get(j) > 1e-9).map((j) => Math.max(j.r || 0, t0))); continue; }
    let cur = avail[0];
    avail.forEach((j) => { if (j.d < cur.d || (j.d === cur.d && rest.indexOf(j) < rest.indexOf(cur))) cur = j; });
    const arrivals = rest.filter((j) => rem.get(j) > 1e-9 && Math.max(j.r || 0, t0) > t + 1e-9).map((j) => Math.max(j.r || 0, t0));
    const nextArr = arrivals.length ? Math.min(...arrivals) : Infinity;
    const end = Math.min(t + rem.get(cur), nextArr);

function bnbEval(jobs, prefix) {

function bnb(jobs) {

  const root = { id: nid++, prefix: [], parent: null, depth: 0 };
  Object.assign(root, bnbEval(jobs, []));
  root.status = root.feasible ? 'sol' : 'open';
  nodes.push(root);
  let best = root.feasible ? { node: root, val: root.LB } : null;
  events.push({ type: 'root', node: root, snap: new Map([[root.id, root.status]]) });
  if (root.feasible) { root.status = 'opt'; return { nodes, events, best }; }

  let guard = 0;
  while (open.length && guard++ < 500) {
    open.sort((a, b) => a.LB - b.LB || b.depth - a.depth || a.id - b.id);
    const node = open.shift();
    if (best && best.val <= node.LB) { open.unshift(node); break; }
    node.status = 'expanded';
    const t = node.t;
    const rest = jobs.filter((j) => !node.prefix.includes(j));
    const kids = [];
    for (const j of rest) {
      const others = rest.filter((k) => k !== j);
      const minFinish = others.length ? Math.min(...others.map((k) => Math.max(t, k.r || 0) + k.p)) : Infinity;
      const kid = { id: nid++, prefix: node.prefix.concat([j]), parent: node, depth: node.depth + 1, job: j };
      const blocker = others.find((k) => Math.max(t, k.r || 0) + k.p <= (j.r || 0));
      kid.check = { rj: j.r || 0, t, minFinish, blocker };
      if (blocker) { kid.status = 'pruned'; nodes.push(kid); kids.push(kid); continue; }
      Object.assign(kid, bnbEval(jobs, kid.prefix));
      if (kid.feasible) {
        kid.status = 'sol';
        if (!best || kid.LB < best.val) best = { node: kid, val: kid.LB };
      } else if (best && kid.LB >= best.val) {
        kid.status = 'bound';
      } else {
        kid.status = 'open';
        open.push(kid);
      }
      nodes.push(kid);
      kids.push(kid);
    }
    // chiudi per bound i nodi aperti che non possono migliorare
    open.forEach((o) => { if (best && o.LB >= best.val) o.status = 'bound'; });
    for (let i = open.length - 1; i >= 0; i--) if (open[i].status === 'bound') open.splice(i, 1);
    const minOpen = open.length ? Math.min(...open.map((o) => o.LB)) : Infinity;
    const stop = best && best.val <= minOpen;
    events.push({ type: 'expand', node, kids, best: best ? { ...best } : null, minOpen, stop, snap: new Map(nodes.map((n) => [n.id, n.status])) });
    if (stop) break;
  }
  if (best) best.node.status = 'opt';
  return { nodes, events, best };
}

// ---------- 7. SMITH ----------
function smith(jobs, dprime) {
  const dp = dprime || jobs.map((j) => j.d);
  let tau = jobs.reduce((s, j) => s + j.p, 0);
  const placed = new Array(jobs.length).fill(false);
  const back = [];
  const iters = [];
  while (back.length < jobs.length) {
    const cand = [];
    jobs.forEach((j, k) => { if (!placed[k] && dp[k] >= tau) cand.push(k); });
    if (!cand.length) { iters.push({ tau, cand: [], pick: null }); return { iters, fail: true, tau }; }
    let best = cand[0];
    cand.forEach((k) => { if (jobs[k].p > jobs[best].p || (jobs[k].p === jobs[best].p && dp[k] > dp[best])) best = k; });
    const allFree = jobs.every((j, k) => placed[k] || dp[k] >= tau);
    iters.push({ tau, cand, pick: best, allFree });
    placed[best] = true;
    back.push(best);
    tau -= jobs[best].p;
  }
  const seqIdx = back.slice().reverse();
  let t = 0;
  const res = seqIdx.map((k) => { t += jobs[k].p; return { k, C: t, L: t - jobs[k].d, Lp: t - dp[k] }; });
  const sumC = res.reduce((s, r) => s + r.C, 0);
  const Tmax = Math.max(0, ...res.map((r) => r.L));
  return { iters, seqIdx, res, sumC, Tmax, fail: false };
}

function evalSeq(jobs, seqIdx) {
  let t = 0;
  const res = seqIdx.map((k) => { t += jobs[k].p; return { k, C: t, L: t - jobs[k].d }; });
  return { res, sumC: res.reduce((s, r) => s + r.C, 0), Tmax: Math.max(0, ...res.map((r) => r.L)) };
}

// ---------- 8. SMITH MODIFICATO (curva di Pareto) ----------
function smithMod(jobs) {
  const idx = (seq) => seq.map((j) => jobs.indexOf(j));
  const spt = evalSeq(jobs, idx(sptOrder(jobs)));
  spt.seqIdx = idx(sptOrder(jobs));
  const edd = evalSeq(jobs, idx(eddOrder(jobs)));

  const dmin = edd.Tmax, dmax = spt.Tmax;
  const runs = [];
  const points = [{ src: 'SPT', sumC: spt.sumC, Tmax: spt.Tmax, seqIdx: spt.seqIdx }];
  let delta = spt.Tmax - 1;
  let guard = 0;
  while (delta >= dmin && guard++ < 100) {
    const dp = jobs.map((j) => j.d + delta);
    const sm = smith(jobs, dp);
    const run = { delta, dp, sm };
    runs.push(run);
    if (sm.fail) break;
    run.point = { src: 'Δ=' + delta, sumC: sm.sumC, Tmax: sm.Tmax, seqIdx: sm.seqIdx };
    points.push(run.point);
    if (sm.Tmax <= dmin) break;
    delta = sm.Tmax - 1;
  }
  const eddPoint = { src: 'EDD', sumC: edd.sumC, Tmax: edd.Tmax, seqIdx: edd.seqIdx };
  const all = points.concat([eddPoint]);
  all.forEach((p) => { p.dominated = all.some((q) => q !== p && q.sumC <= p.sumC && q.Tmax <= p.Tmax && (q.sumC < p.sumC || q.Tmax < p.Tmax)); });

// ---------- 9. GILMORE-GOMORY ----------
function gilmoreGomory(jobs) {

  const LB = phi.reduce((s, pk, k) => s + Math.abs(A[pk] - B[k]), 0);

  for (let s = 0; s < n; s++) if (cyc[s] < 0) { let x = s; while (cyc[x] < 0) { cyc[x] = nc; x = phi[x]; } nc++; }

  const kr = swaps.slice().sort((a, b) => a.cost - b.cost || a.k - b.k);

    par[a] = b; chosen.push(s); krLog.push({ s, ok: true });

  const g1 = chosen.filter((s) => s.type === 1).sort((a, b) => b.k - a.k);
  const g2 = chosen.filter((s) => s.type === 2).sort((a, b) => a.k - b.k);

  const cur = phi.slice();
  const applyLog = [];
  applyOrder.forEach((s) => { const t = cur[s.k]; cur[s.k] = cur[s.k + 1]; cur[s.k + 1] = t; applyLog.push({ s, phiNow: cur.slice() }); });

  const start = ord.indexOf(0);
  const tour = [];
  let x = start;
  do { tour.push(x); x = cur[x]; } while (x !== start && tour.length <= n);
  const legs = tour.map((from, i) => { const to = tour[(i + 1) % tour.length]; return { from, to, cost: Math.abs(A[to] - B[from]) }; });
  const total = legs.reduce((s, l) => s + l.cost, 0);
  const extra = chosen.reduce((s, c) => s + c.cost, 0);
  return { ord, A, B, phi, LB, cycles, cyc, swaps, chosen, krLog, applyOrder, applyLog, finalPhi: cur, tour, legs, total, extra };
}

// ---------- 10. JOHNSON ----------
function johnson(jobs) {

  while (rem.length) {

    let mv = Infinity;

    const ties = rem.filter((j) => j.p1 === mv || j.p2 === mv).length > 1;
    if (where === 'M1') left.push(best); else right.unshift(best);
    iters.push({ job: best, where, val: mv, left: left.slice(), right: right.slice(), rem: rem.slice(), ties });
    rem.splice(rem.indexOf(best), 1);
  }
  const seq = left.concat(right);
  return { iters, seq, gantt: flow2(seq) };

}

// ---------- 11. PIANO DEI TEMPI + A* ----------

  seen.set('0,0', 0);
  let best = null;

  let guard = 0;
  while (open.length && guard++ < 400) {
    open.sort((a, b) => a.f - b.f || a.id - b.id);
    const node = open.shift();
    if (best && best.cost <= node.f) { open.unshift(node); break; }
    node.status = 'expanded';
    const px = node.x, py = node.y;
    const sEnd = Math.min(TB - px, TA - py);
    // primo rettangolo toccato dalla diagonale
    let hit = null;
    rects.forEach((r) => {
      const lo = Math.max(r.x1 - px, r.y1 - py, 0);

// ---------- 12. SHIFTING BOTTLENECK ----------

      const seqJobs = res.best.node.seq;
      return { m, jobs: sj, Lmax: res.best.val, seq: seqJobs.map((x) => x.jIdx), bnb: res };
    });
    let bn = subs[0];
    subs.forEach((s) => { if (s.Lmax > bn.Lmax) bn = s; });
    const it = { Cmax: G.Cmax, subs, bottleneck: bn.m, fixedBefore: { ...fixed } };
    if (bn.Lmax <= 0) {
      subs.forEach((s) => { fixed[s.m] = s.seq; });
      it.allFixed = true;
    } else {
      fixed[bn.m] = bn.seq;
    }
    G = sbGraph(jobs, fixed);
    it.CmaxAfter = G.Cmax;
    iters.push(it);
  }
  // Gantt finale: inizio = head
  const gantt = machines.map((m) => ({ m, ops: G.ops.filter((o) => o.m === m).map((o) => ({ j: o.j, start: G.head.get(o.key), end: G.head.get(o.key) + o.p })).sort((a, b) => a.start - b.start) }));
  return { machines, iters, fixed, C0, Cmax: G.Cmax, gantt, G };
}

<script>
// ===================== UI: helper grafici =====================
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (x) => {
  if (x === Infinity) return '∞';
  if (x === -Infinity) return '−∞';
  if (x === null || x === undefined || Number.isNaN(x)) return '–';
  let r = Math.round(x * 100) / 100;
  if (Object.is(r, -0)) r = 0;

};
const JC = (i) => `var(--j${((i % 8) + 8) % 8})`;
const seqStr = (names) => '<span class="seq">' + names.map(esc).join(' → ') + '</span>';
let SVGID = 0;

// tabella generica: head = [..], rows = [[cell,...]], cell = valore o {v, c (classe), h (html)}
function tbl(head, rows, opt = {}) {
  const cell = (x, tag) => {
    if (x && typeof x === 'object' && !Array.isArray(x)) return `<${tag}${x.c ? ` class="${x.c}"` : ''}>${x.h !== undefined ? x.h : esc(x.v)}</${tag}>`;
    return `<${tag}>${typeof x === 'number' ? fmt(x) : (x ?? '')}</${tag}>`;
  };
  let h = `<div class="scroll"><table class="dt">`;
  if (head) h += '<tr>' + head.map((x) => cell(x, 'th')).join('') + '</tr>';
  rows.forEach((r) => { h += '<tr>' + r.map((x, i) => cell(x, i === 0 && opt.rowHead ? 'th' : 'td')).join('') + '</tr>'; });
  return h + '</table></div>';
}
// tabella "orizzontale": prima colonna = nome riga
function htbl(rows, opt = {}) {
  return tbl(null, rows.map((r) => [{ h: r[0], c: 'rowh' }].concat(r.slice(1))), { rowHead: true, ...opt });
}

// ---------- Gantt ----------
// rows: [{label, segs:[{s,e,txt,ci,late,ghost,idle}]}] ; opt: {T, dues:[{t,txt,row}], noTicks, ticks:[...]}
function gantt(rows, opt = {}) {
  const allEnds = rows.flatMap((r) => r.segs.map((s) => s.e));
  const T = opt.T || Math.max(1, ...allEnds, ...(opt.dues || []).map((d) => d.t));
  const W = 400, padL = opt.labels === false ? 8 : 30, padR = 12, rowH = 24, gap = 10, top = 8;
  const sx = (t) => padL + (t / T) * (W - padL - padR);
  const axisY = top + rows.length * (rowH + gap) - gap + 6;
  const hasDue = (opt.dues || []).length > 0;
  const H = axisY + 18 + (hasDue ? 16 : 0);
  let o = `<svg viewBox="0 0 ${W} ${H}" class="gantt" role="img" aria-label="${esc(opt.aria || 'Diagramma di Gantt')}">`;
  rows.forEach((r, i) => {
    const y = top + i * (rowH + gap);
    if (opt.labels !== false) o += `<text x="${padL - 6}" y="${y + rowH / 2 + 4}" text-anchor="end" class="g-lbl">${esc(r.label || '')}</text>`;
    r.segs.forEach((sg) => {
      const x1 = sx(sg.s), x2 = sx(sg.e), w = Math.max(0.5, x2 - x1);
      if (sg.ghost) {
        o += `<rect x="${x1}" y="${y}" width="${w}" height="${rowH}" rx="3" class="g-ghost"/>`;
      } else {
        o += `<rect x="${x1}" y="${y}" width="${w}" height="${rowH}" rx="3" class="g-seg" style="fill:${JC(sg.ci)}${sg.late ? ';stroke:var(--late);stroke-width:2.2' : ''}"/>`;
      }
      if (sg.txt !== undefined && w > 11) o += `<text x="${(x1 + x2) / 2}" y="${y + rowH / 2 + 4}" text-anchor="middle" class="${sg.ghost ? 'g-tick' : 'g-txt'}">${esc(sg.txt)}</text>`;
    });
  });
  o += `<line x1="${sx(0)}" y1="${axisY}" x2="${sx(T)}" y2="${axisY}" class="g-axis"/>`;
  // tacche: inizi e fine dei segmenti
  let ticks = opt.ticks || [0, ...new Set(rows.flatMap((r) => r.segs.filter((s) => !s.ghost).flatMap((s) => [s.s, s.e])))];
  ticks = [...new Set(ticks)].sort((a, b) => a - b);
  let lastX = -99;
  ticks.forEach((t) => {
    const x = sx(t);
    o += `<line x1="${x}" y1="${axisY - 3}" x2="${x}" y2="${axisY + 3}" class="g-axis"/>`;
    if (x - lastX >= 15 || t === ticks[ticks.length - 1]) { o += `<text x="${x}" y="${axisY + 14}" text-anchor="middle" class="g-tick">${fmt(t)}</text>`; lastX = x; }
  });
  (opt.dues || []).forEach((d) => {
    const x = sx(d.t);
    const ry = top + (d.row || 0) * (rowH + gap);
    o += `<line x1="${x}" y1="${ry - 4}" x2="${x}" y2="${axisY}" class="g-dueline"/>`;
    o += `<text x="${x}" y="${axisY + 29}" text-anchor="middle" class="g-due">${esc(d.txt)}</text>`;

}
// Gantt di una sequenza su macchina singola
function ganttSeq(cum, opt = {}) {
  const segs = cum.map((c) => ({ s: c.S, e: c.C, txt: c.job.id, ci: c.job._i, late: opt.showLate && c.C > c.job.d }));
  const dues = opt.dues ? cum.filter((c) => opt.dues === 'all' || (opt.dues === 'late' && c.C > c.job.d)).map((c) => ({ t: c.job.d, txt: 'd' + c.job.id + '=' + fmt(c.job.d) })) : [];
  return gantt([{ label: opt.label || 'M', segs: segs.concat(opt.extra || []) }], { T: opt.T, dues, labels: opt.labels });
}

// ---------- albero (B&B / A*) ----------
// nodes: [{id, parentId, l1, l2, cls, edge}] ; restituisce svg con larghezza in base alle foglie
function tree(nodes) {
  const kids = new Map(nodes.map((n) => [n.id, []]));
  nodes.forEach((n) => { if (n.parentId !== null && kids.has(n.parentId)) kids.get(n.parentId).push(n); });
  const root = nodes.find((n) => n.parentId === null);
  const BW = 66, BH = 34, HG = 12, VG = 34;
  let leaf = 0;
  const pos = new Map();
  let maxD = 0;
  (function place(n, d) {
    maxD = Math.max(maxD, d);
    const ch = kids.get(n.id);
    if (!ch.length) { pos.set(n.id, { x: leaf++ * (BW + HG), d }); return; }
    ch.forEach((c) => place(c, d + 1));
    const xs = ch.map((c) => pos.get(c.id).x);
    pos.set(n.id, { x: (Math.min(...xs) + Math.max(...xs)) / 2, d });
  })(root, 0);
  const W = Math.max(leaf * (BW + HG) - HG + 8, BW + 8);
  const H = (maxD + 1) * (BH + VG) - VG + 8;
  const cx = (id) => pos.get(id).x + 4 + BW / 2, cy = (id) => pos.get(id).d * (BH + VG) + 4;
  let o = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Albero di enumerazione">`;
  nodes.forEach((n) => {
    if (n.parentId === null) return;
    const x1 = cx(n.parentId), y1 = cy(n.parentId) + BH, x2 = cx(n.id), y2 = cy(n.id);
    o += `<path d="M${x1},${y1} C${x1},${(y1 + y2) / 2} ${x2},${(y1 + y2) / 2} ${x2},${y2}" class="t-edge"/>`;
  });
  nodes.forEach((n) => {
    const x = cx(n.id) - BW / 2, y = cy(n.id);
    o += `<g class="t-node ${n.cls || ''}"><rect x="${x}" y="${y}" width="${BW}" height="${BH}" rx="7"/>`;
    o += `<text x="${x + BW / 2}" y="${y + 14}" text-anchor="middle">${esc(n.l1)}</text>`;
    o += `<text x="${x + BW / 2}" y="${y + 27}" text-anchor="middle" class="sub">${esc(n.l2 || '')}</text></g>`;
  });
  return `<div class="scroll">${o}</svg></div>`;
}
const LEG_TREE = `<div class="legend"><span><i style="background:var(--mark)"></i>nodo che sto aprendo</span><span><i style="border-color:var(--accent);border-width:2px"></i>aperto</span><span><i style="border-color:var(--ok);border-width:2px"></i>soluzione</span><span><i style="background:var(--accent);border-color:var(--accent)"></i>ottimo</span><span><i style="border-style:dashed;border-color:var(--muted)"></i>scartato</span></div>`;

// ---------- piano dei tempi ----------
function plane(P, opt = {}) {
  const id = ++SVGID;
  const padL = 40, padB = 34, padT = 12, padR = 14;
  const s = Math.min((400 - padL - padR) / Math.max(P.TB, 1), (380 - padT - padB) / Math.max(P.TA, 1));

  tools.forEach((t, i) => { o += `<pattern id="h${id}-${i}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" style="fill:${JC(i + 2)};opacity:var(--rect-op)"/><line x1="0" y1="0" x2="0" y2="6" style="stroke:var(--late);stroke-width:1.6;opacity:0.55"/></pattern>`; });
  o += `</defs>`;
  // griglia
  P.B.forEach((b) => { o += `<line x1="${X(b.e)}" y1="${Y(0)}" x2="${X(b.e)}" y2="${Y(P.TA)}" class="pl-grid"/>`; });
  P.A.forEach((a) => { o += `<line x1="${X(0)}" y1="${Y(a.e)}" x2="${X(P.TB)}" y2="${Y(a.e)}" class="pl-grid"/>`; });
  // rettangoli conflitto
  P.rects.forEach((r) => {
    const ti = tools.indexOf(r.tool);

  P.B.forEach((b, i) => {

  });
  P.A.forEach((a, i) => {
    o += `<text x="${X(0) - 4}" y="${Y(a.e) + 3}" text-anchor="end" class="g-tick">${fmt(a.e)}</text>`;
    o += `<text x="${X(0) - 4}" y="${Y((a.s + a.e) / 2) + 3}" text-anchor="end" class="ax-lbl">A${i + 1}${a.tool ? '·' + esc(a.tool) : ''}</text>`;
  });
  o += `<text x="${X(0) - 4}" y="${Y(0) + 12}" text-anchor="end" class="g-tick">0</text>`;
  // percorsi
  (opt.alts || []).forEach((pts) => { o += `<polyline points="${pts.map((p) => X(p[0]) + ',' + Y(p[1])).join(' ')}" class="pl-alt"/>`; });
  if (opt.path) o += `<polyline points="${opt.path.map((p) => X(p[0]) + ',' + Y(p[1])).join(' ')}" class="pl-path"/>`;

    o += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="8" class="pl-pt${p.cur ? ' cur' : ''}"/><text x="${X(p.x)}" y="${Y(p.y) + 3.5}" text-anchor="middle" class="pl-ptlbl">${esc(p.lbl)}</text>`;

}

// ---------- grafico di Pareto ----------
function paretoChart(pts) {
  const W = 400, H = 260, pl = 40, pr = 16, pt = 14, pb = 38;
  const xs = pts.map((p) => p.x), ys = pts.map((p) => p.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = 0, y1 = Math.max(...ys, 1);
  const dx = Math.max(1, x1 - x0);
  const X = (x) => pl + ((x - x0 + dx * 0.08) / (dx * 1.16)) * (W - pl - pr);
  const Y = (y) => pt + (1 - (y - y0) / (y1 * 1.12)) * (H - pt - pb);
  let o = `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Curva di Pareto">`;
  o += `<line x1="${pl}" y1="${Y(0)}" x2="${W - pr}" y2="${Y(0)}" class="pl-axis"/><line x1="${pl}" y1="${Y(0)}" x2="${pl}" y2="${pt}" class="pl-axis"/>`;
  [...new Set(ys)].forEach((y) => { o += `<line x1="${pl}" y1="${Y(y)}" x2="${W - pr}" y2="${Y(y)}" class="pl-grid"/><text x="${pl - 5}" y="${Y(y) + 3}" text-anchor="end" class="g-tick">${fmt(y)}</text>`; });
  let lastX = -99;
  [...new Set(xs)].sort((a, b) => a - b).forEach((x) => { if (X(x) - lastX > 22) { o += `<text x="${X(x)}" y="${Y(0) + 13}" text-anchor="middle" class="g-tick">${fmt(x)}</text>`; lastX = X(x); } });
  o += `<text x="${W - pr}" y="${H - 6}" text-anchor="end" class="ax-lbl">ΣF (= ΣC) →</text><text x="${pl + 4}" y="${pt + 2}" class="ax-lbl">↑ Tmax</text>`;
  const eff = pts.filter((p) => !p.dom).sort((a, b) => a.x - b.x);
  if (eff.length > 1) {
    let d = `M${X(eff[0].x)},${Y(eff[0].y)}`;
    for (let i = 1; i < eff.length; i++) d += ` H${X(eff[i].x)} V${Y(eff[i].y)}`;
    o += `<path d="${d}" fill="none" style="stroke:var(--accent);stroke-width:1.6;stroke-dasharray:4 3"/>`;
  }
  pts.forEach((p, i) => {
    o += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="5.5" style="fill:${p.dom ? 'var(--card)' : 'var(--accent)'};stroke:${p.dom ? 'var(--muted)' : 'var(--accent)'};stroke-width:1.6"/>`;
    o += `<text x="${X(p.x) + 8}" y="${Y(p.y) - 7 - (i % 2) * 9}" class="g-tick">${esc(p.lbl)}</text>`;
  });
  return o + '</svg>';
}

// ---------- grafo dei cicli (Gilmore-Gomory) ----------
function cycleGraph(n, next, cycOf, names) {
  const W = 300, H = 230, cx = 150, cy = 115, R = 88;
  const P = (k) => [cx + R * Math.sin((2 * Math.PI * k) / n), cy - R * Math.cos((2 * Math.PI * k) / n)];
  const id = ++SVGID;
  let o = `<svg viewBox="0 0 ${W} ${H}" class="chart" style="max-width:420px" role="img" aria-label="Grafo dei cicli"><defs><marker id="ar${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink)"/></marker></defs>`;
  for (let k = 0; k < n; k++) {
    const t = next[k];
    const [x1, y1] = P(k), [x2, y2] = P(t);
    if (t === k) { o += `<circle cx="${x1 + (x1 - cx) * 0.24}" cy="${y1 + (y1 - cy) * 0.24}" r="12" fill="none" style="stroke:${JC(cycOf[k])};stroke-width:2.4"/>`; continue; }
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy);
    const ux = dx / L, uy = dy / L;
    const sx = x1 + ux * 15, sy = y1 + uy * 15, ex = x2 - ux * 16, ey = y2 - uy * 16;
    const bend = next[t] === k ? 26 : 14;
    const mx = (sx + ex) / 2 - uy * bend, my = (sy + ey) / 2 + ux * bend;
    o += `<path d="M${sx},${sy} Q${mx},${my} ${ex},${ey}" fill="none" style="stroke:${JC(cycOf[k])};stroke-width:2.6" marker-end="url(#ar${id})"/>`;
  }
  for (let k = 0; k < n; k++) {
    const [x, y] = P(k);
    o += `<circle cx="${x}" cy="${y}" r="13" style="fill:var(--card);stroke:var(--ink);stroke-width:1.4"/><text x="${x}" y="${y + 4}" text-anchor="middle" style="font-size:11px;font-weight:600">${esc(names[k])}</text>`;
  }
  return o + '</svg>';
}

// ---------- grafo job shop (shifting bottleneck) ----------
function jobGraph(jobs, fixed, G) {
  const nodeW = 50, gapX = 26, rowH = 52, padL = 30;
  const maxOps = Math.max(...jobs.map((J) => J.ops.length));
  const W = padL * 2 + maxOps * (nodeW + gapX) + 10, H = jobs.length * rowH + 16;
  const pos = (j, k) => [padL + 14 + k * (nodeW + gapX) + nodeW / 2, 14 + j * rowH + 14];
  const id = ++SVGID;
  const machines = [...new Set(jobs.flatMap((J) => J.ops.map((o) => o.m)))].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  let o = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Grafo del job shop"><defs><marker id="sa${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--muted)"/></marker></defs>`;
  jobs.forEach((J, j) => {
    const [x0, y0] = pos(j, 0);
    o += `<text x="6" y="${y0 + 4}" class="g-lbl">J${esc(J.id)}</text>`;
    for (let k = 0; k + 1 < J.ops.length; k++) {
      const [a, b] = pos(j, k), [c] = pos(j, k + 1);
      o += `<line x1="${a + nodeW / 2}" y1="${b}" x2="${c - nodeW / 2 - 1}" y2="${b}" style="stroke:var(--muted);stroke-width:1.3" marker-end="url(#sa${id})"/>`;
    }
  });
  Object.entries(fixed || {}).forEach(([m, seq]) => {
    const mi = machines.indexOf(m);
    for (let i = 0; i + 1 < seq.length; i++) {
      const ja = seq[i], jb = seq[i + 1];
      const ka = jobs[ja].ops.findIndex((x) => x.m === m), kb = jobs[jb].ops.findIndex((x) => x.m === m);
      const [x1, y1] = pos(ja, ka), [x2, y2] = pos(jb, kb);
      const mx = (x1 + x2) / 2 + (y2 > y1 ? 22 : -22), my = (y1 + y2) / 2;
      o += `<path d="M${x1},${y1 + (y2 > y1 ? 12 : -12)} Q${mx},${my} ${x2},${y2 + (y2 > y1 ? -12 : 12)}" fill="none" style="stroke:${JC(mi + 1)};stroke-width:2.4" marker-end="url(#sa${id})"/>`;
    }
  });
  jobs.forEach((J, j) => J.ops.forEach((op, k) => {
    const [x, y] = pos(j, k);
    const mi = machines.indexOf(op.m);
    const key = j + ':' + k;
    o += `<rect x="${x - nodeW / 2}" y="${y - 12}" width="${nodeW}" height="24" rx="12" style="fill:${JC(mi + 1)};stroke:var(--ink);stroke-width:1"/>`;
    o += `<text x="${x}" y="${y + 4}" text-anchor="middle" class="g-txt">${esc(op.m)}·${fmt(op.p)}</text>`;
    if (G && G.head) o += `<text x="${x - nodeW / 2}" y="${y + 23}" class="g-tick">r ${fmt(G.head.get(key))}</text>`;
  }));
  return `<div class="scroll">${o}</svg></div>`;
}

// ---------- stepper ----------
function stepper(host, steps, key) {
  const st = (stepper.state[key] = stepper.state[key] || { i: 0, all: false });
  if (st.i >= steps.length) st.i = steps.length - 1;
  const draw = () => {
    let h = `<div class="btnrow"><span class="eyebrow">Passo ${st.all ? 'tutti' : st.i + 1 + ' di ' + steps.length}</span>`;

function prepJobs(data, cols) {
  if (!data.rows || !data.rows.length) throw new Error('Aggiungi almeno un job.');
  const seen = new Set();
  return data.rows.map((r, i) => {
    const j = { id: String(r.id ?? '').trim() || String(i + 1), _i: i };
    if (seen.has(j.id)) throw new Error(`Il nome "${j.id}" compare due volte: dai nomi diversi ai job.`);
    seen.add(j.id);
    cols.forEach((c) => {
      const raw = String(r[c.k] ?? '').trim();
      if (c.type === 'txt') { if (!raw && !c.opt) throw new Error(`Job ${j.id}: manca ${c.name}.`); j[c.k] = raw; return; }
      if (raw === '') { if (c.opt) { j[c.k] = undefined; return; } throw new Error(`Job ${j.id}: manca ${c.name}.`); }
      const v = num(raw);
      if (Number.isNaN(v)) throw new Error(`Job ${j.id}: ${c.name} deve essere un numero (hai scritto "${raw}").`);
      if (c.pos && v <= 0) throw new Error(`Job ${j.id}: ${c.name} deve essere maggiore di zero.`);
      if (!c.neg && v < 0) throw new Error(`Job ${j.id}: ${c.name} non può essere negativo.`);
      j[c.k] = v;
    });
    return j;
  });
}

function parsePrec(txt, jobs) {
  const out = [];
  const s = String(txt || '').trim();
  if (!s) return out;
  s.split(/[,;\s]+/).filter(Boolean).forEach((tok) => {
    const m = /^([^>→\-]+)(?:>|→|->)([^>→\-]+)$/.exec(tok);
    if (!m) throw new Error(`Precedenza "${tok}" non capita: scrivi per esempio 4>2 (4 prima di 2).`);
    const a = jobs.findIndex((j) => j.id === m[1]), b = jobs.findIndex((j) => j.id === m[2]);
    if (a < 0 || b < 0) throw new Error(`Precedenza "${tok}": il job ${a < 0 ? m[1] : m[2]} non esiste.`);
    out.push([a, b]);
  });
  return out;
}

// ---------------------------------------------------------------- 6 B&B
function bnbTree(res, snap, curId) {
  const st = (n) => (snap ? snap.get(n.id) : n.status);
  const nodes = res.nodes.filter((n) => !snap || snap.has(n.id));
  return tree(nodes.map((n) => {
    const s = st(n);
    const cls = { expanded: '', open: 'open', pruned: 'pruned', bound: 'bound', sol: 'sol', opt: 'opt' }[s] + (n.id === curId ? ' cur' : '');
    const l1 = '<' + n.prefix.map((j) => j.id).join(',') + '>';
    const l2 = s === 'pruned' ? '✂ potato' : 'LB ' + fmt(n.LB) + (s === 'sol' || s === 'opt' ? ' ✓' : '');
    return { id: n.id, parentId: n.parent ? n.parent.id : null, l1: n.prefix.length ? l1 : '< >', l2, cls };
  })) + LEG_TREE;
}
function bnbGantt(ev, T) {
  const segs = ev.fixed.map((f) => ({ s: f.start, e: f.end, txt: f.job.id, ci: f.job._i }));
  const rest = ev.pr.segs.map((s) => ({ s: s.start, e: s.end, txt: s.job.id, ci: s.job._i, late: ev.pr.preempted.includes(s.job) }));
  return gantt([{ label: 'M', segs: segs.concat(rest) }], { T });
}

// ---------------------------------------------------------------- 11 PIANO DEI TEMPI + A*
function parseOps(txt, who) {
  const s = String(txt || '').trim();
  if (!s) throw new Error(`Scrivi le operazioni del job ${who}, per esempio: 4b, 4c, 3b`);
  return s.split(/[,;]+|\s+(?=\d)/).map((t) => t.trim()).filter(Boolean).map((t) => {
    const m = /^(\d+(?:[.,]\d+)?)\s*([^\s\d][^\s]*)?$/.exec(t);
    if (!m) throw new Error(`Job ${who}: "${t}" non capito. Scrivi durata + utensile, es. 4b.`);
    return { p: num(m[1]), tool: m[2] || '' };
  });
}
function planeNodes(res, uptoStep) {
  const st = res.steps[uptoStep];
  const ids0 = new Set(st ? [...st.snap.keys()] : res.nodes.map((n) => n.id));
  return res.nodes.filter((n) => ids0.has(n.id));
}
function aStarTree(res, snap, curId) {
  const nodes = res.nodes.filter((n) => !snap || snap.has(n.id));
  return tree(nodes.map((n) => {
    const s = snap ? snap.get(n.id) : n.status;
    const isBest = res.best && res.chain.includes(n) && !snap;

function parseRoute(txt, who) {
  const s = String(txt || '').trim();
  if (!s) throw new Error(`Job ${who}: scrivi il percorso, es. M1 9, M2 8`);
  return s.split(/[,;]+/).map((t) => t.trim()).filter(Boolean).map((t) => {
    const m = /^(M?\s*\d+|[A-Za-z]\w*)\s*[:=\s]\s*(\d+(?:[.,]\d+)?)$/.exec(t);
    if (!m) throw new Error(`Job ${who}: "${t}" non capito. Scrivi macchina e durata, es. M2 8.`);
    let mm = m[1].replace(/\s+/g, '');
    if (/^\d+$/.test(mm)) mm = 'M' + mm;
    return { m: mm, p: num(m[2]) };
  });
}

  const meas = [
    ['C<sub>k</sub>', 'p<sub>1</sub> + … + p<sub>k</sub>', 'completamento del k-esimo job (tutti pronti a 0, senza tempi morti)'],
    ['C<sub>i</sub> con r<sub>i</sub>', 'max(C<sub>prec</sub>, r<sub>i</sub>) + p<sub>i</sub>', 'il job non parte prima del suo rilascio'],
    ['C<sub>max</sub>', 'max C<sub>i</sub>', 'makespan; con una macchina e niente tempi morti = Σp (+ set-up)'],
    ['F<sub>i</sub>', 'C<sub>i</sub> − r<sub>i</sub>', 'flusso: tempo passato nel sistema'],
    ['L<sub>i</sub>', 'C<sub>i</sub> − d<sub>i</sub>', 'lateness, negativa se in anticipo'],
    ['T<sub>i</sub>', 'max(0, C<sub>i</sub> − d<sub>i</sub>)', 'tardiness: solo il ritardo'],
    ['E<sub>i</sub>', 'max(0, d<sub>i</sub> − C<sub>i</sub>)', 'anticipo'],
    ['U<sub>i</sub>', '1 se L<sub>i</sub> &gt; 0, altrimenti 0', 'ΣU = numero di job in ritardo'],
    ['attesa', 'C<sub>i</sub> − p<sub>i</sub> − r<sub>i</sub>', 'tempo passato in coda'],
  ];
  app.innerHTML = `
  <section class="card">
    <span class="eyebrow">SPIL · Scheduling</span>
    <h1>Dispense Scheduling</h1>
    <p>I 13 algoritmi di scheduling del corso. Per ognuno: l'idea in parole semplici, la ricetta, e un esercizio che puoi modificare e risolvere passo per passo, con Gantt, alberi e grafici disegnati.</p>
    <p class="small muted">Come usarla per l'esame: risolvi prima su carta, poi premi <b>Avanti</b> e controlla un passo alla volta. Con <b>Esercizio casuale</b> hai numeri sempre nuovi.</p>
  </section>
  <section class="card"><h2>Quale algoritmo uso?</h2><p class="small muted">Rispondi leggendo il testo dell'esercizio.</p><div class="quiz" id="quiz"></div></section>
  <section class="card"><h2>I 13 algoritmi</h2><div class="home-grid">${ALGOS.map((a) => `<a class="algo-link" href="#${a.slug}"><span class="n">${a.num}</span><span class="t">${a.name}</span><span class="s">${a.nota}</span></a>`).join('')}</div></section>
  <section class="card"><h2>Notazione α | β | γ</h2><p>α = l'officina (1 macchina, F2 flow shop, J2 o Jm job shop); β = i vincoli (r<sub>i</sub> rilasci, prec precedenze, s<sub>ij</sub> set-up, prmp interruzioni); γ = cosa minimizzi.</p>${tbl(['misura', 'formula', 'significato'], meas.map((m) => [{ h: `<b>${m[0]}</b>` }, { h: m[1] }, { h: m[2], c: '' }]))}</section>`;
  renderQuiz(document.getElementById('quiz'));
}

// ---------- scheda algoritmo ----------
function editorHTML(a, d) {
  let h = '';
  if (a.cols) {
    h += `<div class="scroll"><table class="dt ed"><tr><th>job</th>${a.cols.map((c) => `<th>${c.l}</th>`).join('')}<th></th></tr>`;
    d.rows.forEach((r, i) => {
      h += `<tr><td><input id="in-${i}-id" data-r="${i}" data-k="id" value="${esc(r.id ?? '')}" aria-label="Nome del job ${i + 1}"></td>`;
      h += a.cols.map((c) => `<td><input id="in-${i}-${c.k}" data-r="${i}" data-k="${c.k}" value="${esc(r[c.k] ?? '')}" ${c.type === 'txt' ? `class="wide"${c.wide && a.slug === 'sb' ? ' style="width:14em"' : ''}` : 'inputmode="decimal"'} aria-label="${esc(strip(c.l))} del job ${i + 1}"></td>`).join('');
      h += `<td><button type="button" class="x" data-del="${i}" aria-label="Togli il job ${i + 1}">✕</button></td></tr>`;
    });
    h += `</table></div><div class="btnrow"><button type="button" class="btn" data-add="1">+ Aggiungi job</button></div>`;
  }
  (a.extras || []).forEach((e) => { h += `<div class="field"><label for="ex-${e.k}">${e.l}</label><input type="text" id="ex-${e.k}" data-x="${e.k}" value="${esc((d.extra || {})[e.k] ?? '')}" placeholder="${esc(e.ph || '')}" autocomplete="off"></div>`; });
  if (a.help) h += a.help;
  return h;
}
function renderAlgo(a) {
  const head = `<article class="card"><div class="algohead"><div class="num">${a.num}</div><h1>${a.name}</h1><p class="muted">${a.full} · <span class="nota">${a.nota}</span></p></div><p><span class="eyebrow">Obiettivo</span> ${a.goal}</p><div class="idea"><p>${a.idea}</p><p class="analog">${a.analog}</p></div></article>`;
  const recipe = `<section class="card"><h2>La ricetta</h2><ol class="recipe">${a.recipe.map((r) => `<li>${r}</li>`).join('')}</ol></section>`;
  const traps = `<section class="card"><h2>Occhio a</h2><ul class="traps">${a.traps.map((r) => `<li>${r}</li>`).join('')}</ul></section>`;
  const nav = navLinks(a);
  if (a.static) { app.innerHTML = head + recipe + traps + nav; return; }
  app.innerHTML = head + recipe + `
  <section class="card" id="lab"><h2>Prova con i numeri</h2>
    <div class="exrow" id="exrow"></div>
    <p class="small muted" id="exnote"></p>
    <div id="editor" class="stepper"></div>
    <div class="err" id="err" hidden></div>
  </section>
  <section class="card"><h2>Passo per passo</h2><div id="steps" class="stepper"></div></section>
  <div id="exam"></div>` + traps + nav;
  const d = dataOf(a);
  const exrow = document.getElementById('exrow'), exnote = document.getElementById('exnote'), editor = document.getElementById('editor');
  const drawChips = () => {
    exrow.innerHTML = a.examples.map((ex, i) => `<button type="button" class="chip" data-ex="${i}" aria-pressed="${d.ex === i}">${esc(ex.name)}</button>`).join('') + `<button type="button" class="chip" data-ex="rnd" aria-pressed="${d.ex === 'rnd'}">Esercizio casuale</button>`;
    exnote.innerHTML = d.note || '';
  };
  const drawEditor = () => { editor.innerHTML = editorHTML(a, d); };
  let timer = null;
  const run = () => {
    const err = document.getElementById('err');
    try {
      const out = a.solve(d);
      err.hidden = true;
      stepper(document.getElementById('steps'), out.steps, a.slug);
      document.getElementById('exam').innerHTML = out.exam || '';
    } catch (e) {
      err.hidden = false;
      err.textContent = e.message || String(e);
      if (!(e instanceof Error) || !/^(Job|Il nome|Aggiungi|Scrivi|Precedenza|Le precedenze|Δ)/.test(e.message)) console.error(e);
    }
  };
  exrow.onclick = (e) => {
    const b = e.target.closest('[data-ex]');
    if (!b) return;
    if (b.dataset.ex === 'rnd') { const r = a.rand(); d.rows = clone(r.rows || []); d.extra = clone(r.extra || {}); d.ex = 'rnd'; d.note = 'Esercizio casuale: risolvilo su carta, poi controlla un passo alla volta.'; }
    else { const ex = a.examples[+b.dataset.ex]; d.rows = clone(ex.rows || []); d.extra = clone(ex.extra || {}); d.ex = +b.dataset.ex; d.note = ex.note; }
    stepper.state[a.slug] = { i: 0, all: false };
    drawChips(); drawEditor(); run();
  };
  editor.oninput = (e) => {
    const t = e.target;
    if (t.dataset.x) { d.extra = d.extra || {}; d.extra[t.dataset.x] = t.value; }
    else if (t.dataset.r !== undefined) d.rows[+t.dataset.r][t.dataset.k] = t.value;
    else return;
    clearTimeout(timer);
    timer = setTimeout(run, 350);
  };
  editor.onclick = (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.add) {
      const used = new Set(d.rows.map((r) => r.id));
      const numeric = d.rows.length && d.rows.every((r) => /^\d+$/.test(r.id));
      let id = '';
      if (numeric) { let k = Math.max(...d.rows.map((r) => +r.id)) + 1; id = String(k); }
      else { id = [...letters].find((l) => !used.has(l)) || 'J' + (d.rows.length + 1); }
      const row = { id };
      a.cols.forEach((c) => { row[c.k] = c.type === 'txt' ? (d.rows[d.rows.length - 1] || {})[c.k] || '' : ''; });
      d.rows.push(row);
      drawEditor(); run();
      const first = document.getElementById(`in-${d.rows.length - 1}-${a.cols[0].k}`);
      if (first) first.focus();
    } else if (b.dataset.del !== undefined) {
      d.rows.splice(+b.dataset.del, 1);
      drawEditor(); run();
    }
  };
  drawChips(); drawEditor(); run();
}
function navLinks(a) {
  const i = ALGOS.indexOf(a);
  const prev = ALGOS[i - 1], next = ALGOS[i + 1];
  return `<nav class="btnrow" aria-label="Altre schede">${prev ? `<a class="btn" href="#${prev.slug}">◀ ${prev.num} · ${prev.name}</a>` : '<a class="btn" href="#home">◀ Home</a>'}${next ? `<a class="btn" href="#${next.slug}">${next.num} · ${next.name} ▶</a>` : '<a class="btn" href="#home">Home ▶</a>'}</nav>`;
}

// apri un sottoproblema dello shifting bottleneck nel B&B
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-bnb]');
  if (!b) return;
  const rows = JSON.parse(b.dataset.bnb).map((j) => ({ id: j.id, p: String(j.p), r: String(j.r), d: String(j.d) }));
  DATA.bnb = { rows, extra: {}, ex: 'sb', note: 'Sottoproblema 1 | r<sub>j</sub> | L<sub>max</sub> preso dallo shifting bottleneck.' };
  stepper.state.bnb = { i: 0, all: false };
  location.hash = 'bnb';
});

// ---------- routing ----------
pick.innerHTML = `<option value="home">Home · Quale algoritmo?</option>` + ALGOS.map((a) => `<option value="${a.slug}">${a.num} · ${a.name} — ${strip(a.nota)}</option>`).join('');
pick.onchange = () => { location.hash = pick.value; };
function route() {
  const slug = (location.hash || '').replace('#', '') || 'home';
  const a = BYSLUG.get(slug);
  pick.value = a ? slug : 'home';
  if (a) renderAlgo(a);
  else renderHome();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();

</script>
</body>
</html>
